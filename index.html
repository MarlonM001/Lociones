<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Perfumería de lujo online — Lociones árabes, para mujer y para caballero. Compra fácil, envíos a toda Colombia, confirmación por WhatsApp." />
    <meta property="og:title" content="Essence Polar — Perfumería de Lujo" />
    <meta property="og:description" content="Lociones árabes, para mujer y para caballero. Pedidos confirmados por WhatsApp." />
    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook...): esas apps no ejecutan la página,
         leen estas etiquetas, y la imagen tiene que ser una dirección completa. Al cambiar de dominio, actualízalas. -->
    <meta property="og:image" content="https://lociones-sable.vercel.app/images/brand/logo-icon.png" />
    <meta property="og:url" content="https://lociones-sable.vercel.app/" />
    <meta property="og:site_name" content="Essence Polar" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://lociones-sable.vercel.app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Essence Polar — Perfumería de Lujo</title>
    <script>
      (function () {
        var stored = localStorage.getItem('essence_theme')
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
